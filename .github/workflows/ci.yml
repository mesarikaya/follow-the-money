name: CI

on:
  push:
    branches: [main, develop]
  # Run on every PR regardless of target branch so stacked / feature-to-feature
  # PRs are validated (previously only main/develop-targeted PRs triggered CI).
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Docker-free build: jOOQ codegen + tests run against this PostgreSQL service,
    # matching the local default (no Testcontainers).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ftm
          POSTGRES_PASSWORD: ftm
          POSTGRES_DB: ftm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create isolated test database
        run: PGPASSWORD=ftm psql -h localhost -U ftm -d ftm -c "CREATE DATABASE ftm_test;"

      - name: Run backend tests
        run: ./mvnw test -q
        working-directory: ftm-app

  frontend-unit:
    name: Frontend Typecheck + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ftm-frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install
        working-directory: ftm-frontend

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high
        working-directory: ftm-frontend

      - name: TypeScript typecheck
        run: pnpm typecheck
        working-directory: ftm-frontend

      - name: Jest unit tests
        run: pnpm test
        working-directory: ftm-frontend

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ftm-frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install
        working-directory: ftm-frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ftm-frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ftm-frontend

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: ftm-frontend

      - name: Run E2E tests
        run: pnpm exec playwright test --config playwright.config.ci.ts
        working-directory: ftm-frontend
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ftm-frontend/playwright-report/
          retention-days: 7
