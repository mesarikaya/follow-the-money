services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ftm
      POSTGRES_USER: ftm
      POSTGRES_PASSWORD: ftm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm -d ftm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
